<div class="previous-updates page-content">
    <app-panel title="Previous Gameweeks" [horizontal]="true">
        <div class="previous-updates__gw-select">
            <div class="previous-updates__gw-btn" (click)="isListOpen.set(!isListOpen())">
                <span>GW {{selectedGameweek()}}</span>
                <ng-icon name="ionChevronDown" />
            </div>
            @if (isListOpen()) {
                <div class="previous-updates__gw-list">
                    @for (gw of gameweekButtons(); track gw) {
                        <div class="
                            previous-updates__gw-list-item 
                            {{gw === selectedGameweek() ? 'selected' : ''}}
                            " 
                            (click)="selectGameweek(gw)">
                            GW {{gw}}
                        </div>
                    }
                </div>
            }
        </div>
    </app-panel>
    
    <app-updates #updates [gameweek]="selectedGameweek()" [isCurrent]="false" />
</div>
